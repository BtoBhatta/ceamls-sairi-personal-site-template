<div class="site-container">
  <aside class="sidebar fade-slide-up" id="sidebar">
    {% if site.logo_on_light %}
    <img src="{{ site.logo_on_light | relative_url }}" alt="{{ site.program }}" class="sidebar-logo" />
    {% endif %}
    <div class="sidebar-header">
      <h3>Navigation</h3>
      <button id="menu-toggle" class="hamburger" aria-label="Toggle navigation">☰</button>
    </div>
    <nav class="sidebar-links" id="sidebar-links">
      <ul>
        <li><a href="{{ '/' | relative_url }}">Home</a></li>
        <li><a href="{{ '/about-me.html' | relative_url }}">About Me</a></li>
        <li><a href="{{ '/about-my-mentor.html' | relative_url }}">About My Mentors</a></li>
        <li><a href="{{ '/about-my-project.html' | relative_url }}">About My Project</a></li>
        <li><a href="{{ '/my-blog.html' | relative_url }}">My Blog</a></li>
      </ul>
    </nav>
  </aside>

  <main class="content-area fade-slide-up">
    {{ content }}
  </main>
</div>

<footer class="footer">
  <p>{{ site.program }} Summer {{ site.year }}</p>
  {% if site.github.is_project_page %}
  <p>Maintained by <a href="{{ site.github.owner_url }}">{{ site.github.owner_name }}</a></p>
  {% endif %}
</footer>

<script src="{{ '/assets/js/themes/minimal.js' | relative_url }}" defer></script>

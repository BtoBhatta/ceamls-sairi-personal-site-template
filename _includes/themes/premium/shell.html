<nav class="topnav" id="topnav">
  <div class="topnav__inner">
    <a href="{{ '/' | relative_url }}" class="topnav__logo">
      {% if site.logo_on_light %}<img src="{{ site.logo_on_light | relative_url }}" alt="" class="topnav__logo-img">{% endif %}
      <span>{{ site.program }}</span>
    </a>
    <ul class="topnav__links" id="navLinks">
      <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' or page.url == '/index.html' %}class="active"{% endif %}>Home</a></li>
      <li><a href="{{ '/about-me.html' | relative_url }}" {% if page.url == '/about-me.html' %}class="active"{% endif %}>About</a></li>
      <li><a href="{{ '/about-my-mentor.html' | relative_url }}" {% if page.url == '/about-my-mentor.html' %}class="active"{% endif %}>Mentors</a></li>
      <li><a href="{{ '/about-my-project.html' | relative_url }}" {% if page.url == '/about-my-project.html' %}class="active"{% endif %}>Project</a></li>
      <li><a href="{{ '/my-blog.html' | relative_url }}" {% if page.url == '/my-blog.html' or page.layout == 'post' %}class="active"{% endif %}>Blog</a></li>
    </ul>
    <button class="topnav__toggle" id="navToggle" aria-label="Menu" aria-expanded="false">
      <span></span><span></span>
    </button>
  </div>
</nav>

<main>
  {{ content }}
</main>

<footer class="site-footer">
  <div class="site-footer__inner">
    <p>{{ site.program }} Summer {{ site.year }}</p>
  </div>
</footer>

<div class="nav-overlay" id="navOverlay"></div>
<script src="{{ '/assets/js/themes/premium.js' | relative_url }}" defer></script>
